name: Smoke Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n backpunk.sh
          bash -n tests/smoke-test.sh

      - name: Run smoke test
        run: bash tests/smoke-test.sh
